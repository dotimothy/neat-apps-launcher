# Neat Apps Launcher settings and per-app overrides.
#
# The app list itself is src/launcher/catalog.json, generated from
# sima-neat/apps by tools/build_catalog.py. Entries under `apps:` below
# change or add fields for one app (matched by id = the app's folder name).
# Override any of this without editing the file: put the same keys in
# config.local.yaml next to run.sh.

install_root: /media/nvme          # prebuilt-apps/ is installed here
bundle_dir: prebuilt-apps          # relative to install_root
bundle_branch: main                # sima-neat/apps branch of the bundle
sima_cli: /data/sima-cli/.venv/bin/sima-cli   # falls back to sima-cli on PATH
pyneat: ~/pyneat                   # Python environment with pyneat (Python apps)

insight:
  port: 9900
  venv: ~/.simaai/neat-insight/venv
  # Sample videos for the streaming apps (H.264, 720p, 16 fps).
  samples: https://artifacts.sima-neat.com/assets/videos/720p16/video{n:02d}.mp4
  sample_count: 16

studio_launcher_port: 8090         # Neat Studio Launcher, linked from GenAI apps
# sudo_password: only ever in config.local.yaml (kept out of git). Setup steps that need root
# (Neat Core, ffmpeg) use it when sudo asks for a password; without it, Set Up Everything asks.

# Sample input images ------------------------------------------------------------
# Photo sets for the apps that read pictures, downloaded into the launcher's
# cache (cache/images/<set>/) by Set Up Everything, Get Them (Manager) or the
# first run. An app uses one with `sample_images: <set>` below; without it, or
# when the download fails, the app reads the bundle's own images.
sample_images:

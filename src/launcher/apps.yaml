# Per-app overrides ------------------------------------------------------------
#   hidden: true            leave it out of the catalog
#   needs: "..."            hardware or setup the app needs (shown as a warning)
#   media: [paths]          stream these bundle files instead of the sample videos
#   sample_images: <set>    read this sample image set (see sample_images above)
#   default_models: [ids]   models downloaded and used by default
#   streams: N              default number of streams for a multi-stream app
#   profiles: {N: {config, fps}}
#                           a config per stream count (in src/common), and the source FPS it expects
#   config: {a.b: value}    set config keys on every run
#   link: {label, url}      a button to somewhere else instead of Run
#   placeholders: {"<name>": value}
#                           fill other config placeholders (models/... paths resolve
#                           to the bundle; "" blanks an unused optional source)
#   before_first_run: {args, creates: [config keys], label}
#                           run the app once with args when those files are missing
#                           or older than the model (e.g. --calibrate)
apps:
  - id: fastflow-anomaly-detector
    media: [assets/datasets/blue-discs/discs_demo.mp4]
    note: Streams the bundled blue-discs clip (FastFlow was trained on square frames of it).

  - id: yolo26-tiny-drone-tracker
    media: [assets/datasets/yolo26-tiny-drone-tracker/anti_uav_multi_uav_source_demo.mp4]
    note: Streams the bundled anti-UAV clip with several small drones.

  - id: single-stream-thermal-face-detector
    note: Built for a thermal camera. The sample streams are visible-light, so expect fewer faces; point it at your own thermal RTSP stream for the real thing.

  - id: single-stream-object-detector
    placeholders: { "<http-mjpeg-url>": "" }   # optional HTTP source; the launcher uses RTSP

  - id: single-stream-instance-segmenter
    placeholders: { "<http-mjpeg-url>": "" }

  - id: multi-stream-blazepose3d
    placeholders:
      "<detector-model-path>": models/yolo26m-det-int8-b1.tar.gz
      "<blazepose-model-path>": models/blazepose_ghum_heavy_w16a16_mpk.tar.gz

  - id: efficientsam3-promptable-segmenter
    placeholders:
      "<text-encoder-path>": models/efficientsam3_text_encoder_mpk.tar.gz

  - id: rfdetr-detection-segmentation
    default_models: [rfdetr-small-backbone, rfdetr-small-transformer]
    note: Uses the small detection pair. For the medium or segmentation models, tick them in Models, then set model.task or model.detection.variant in the config.

  - id: high-density-multi-stream-object-detector
    streams: 20
    # The app ships a tuned config per stream count; 30 and 60 expect 720p sources at exactly
    # 20 and 10 FPS, so the launcher streams copies of the sample videos made at that rate.
    profiles:
      20: {config: config.yaml}
      30: {config: config-30x720p20fps.yaml, fps: 20}
      60: {config: config-60x720p10fps.yaml, fps: 10}
    note: Pick 20, 30 or 60 streams; each uses the app's own tuned profile. 60 streams run at 10 FPS each and fill 60 of Insight's 80 channels.

  - id: mipi-camera-capture
    needs: A MIPI CSI camera connected to the DevKit.

  - id: image-classification-explorer
    sample_images: imagenet
    note: Classifies 16 ImageNet sample photos (goldfish, tabby, zebra, school bus, espresso, ...) with every listed model. Set io.input in Config to use your own image or folder.

  - id: yolo26-object-detector
    sample_images: scenes

  - id: detr-object-detector
    sample_images: scenes

  - id: ssd-mobilenet-object-detector
    sample_images: scenes

  - id: depth-estimator
    sample_images: scenes

  - id: face-detector
    sample_images: faces

  - id: patchcore-anomaly-detector
    note: The first run builds its memory bank from the bundled known-good images (--calibrate). To use your own, set calibration.nominal_images_dir in Config and delete the old bank in memory_bank.path.
    before_first_run:              # runs again when these files are missing or older than the model
      args: --calibrate
      creates: [memory_bank.path, memory_bank.meta_path]
      label: Building the memory bank from the known-good images (--calibrate, first run only)

  - id: mipi-multi-model
    needs: A MIPI CSI camera connected to the DevKit.

  - id: parallel-apps
    hidden: true                   # runs its apps in Docker containers, not as one binary

  - id: pcie-high-density-multi-stream-object-detector
    hidden: true                   # runs on a PCIe host, not on the board

  - id: detection-to-vlm-assistant
    hidden: true                   # its VLM model is not published yet (test-scope: huggingface, TBD)

  - id: neat-genai-studio
    link:
      label: Open in Neat Studio Launcher
      url: "https://{host}:8090/#/studio/genai"
    note: Neat GenAI Studio is a full web studio; install and launch it from Neat Studio Launcher.
